{% extends "base.html" %}
{% block title %}Page not found · {{ config.title }}{% endblock title %}
{% block content %}
<div class="page-width section-page">
  <header class="page-header">
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p class="lede">The page may have moved or the address may be incorrect.</p>
  </header>
  <p><a href="{{ get_url(path='@/_index.md') | safe }}">Return to the homepage</a></p>
</div>
{% endblock content %}
