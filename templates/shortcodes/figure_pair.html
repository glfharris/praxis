{% set left_path = page.colocated_path ~ left_src %}
{% set right_path = page.colocated_path ~ right_src %}
{% set left_meta = get_image_metadata(path=left_path) %}
{% set right_meta = get_image_metadata(path=right_path) %}
<div class="figure-pair">
  <figure class="article-figure">
    <div class="figure-pair__media">
      <img src="{{ left_src }}" alt="{{ left_alt }}" width="{{ left_meta.width }}" height="{{ left_meta.height }}" loading="lazy">
    </div>
    {% if left_caption or left_credit %}
    <figcaption>
      {% if left_caption %}<span>{{ left_caption }}</span>{% endif %}
      {% if left_credit %}<small>Credit: {{ left_credit }}</small>{% endif %}
    </figcaption>
    {% endif %}
  </figure>
  <figure class="article-figure">
    <div class="figure-pair__media">
      <img src="{{ right_src }}" alt="{{ right_alt }}" width="{{ right_meta.width }}" height="{{ right_meta.height }}" loading="lazy">
    </div>
    {% if right_caption or right_credit %}
    <figcaption>
      {% if right_caption %}<span>{{ right_caption }}</span>{% endif %}
      {% if right_credit %}<small>Credit: {{ right_credit }}</small>{% endif %}
    </figcaption>
    {% endif %}
  </figure>
</div>
