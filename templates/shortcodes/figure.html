{% set asset_path = page.colocated_path ~ src %}
{% set asset_meta = get_image_metadata(path=asset_path) %}
<figure class="article-figure">
  <img src="{{ src }}" alt="{{ alt }}" width="{{ asset_meta.width }}" height="{{ asset_meta.height }}" loading="lazy">
  {% if caption or credit %}
  <figcaption>
    {% if caption %}<span>{{ caption }}</span>{% endif %}
    {% if credit %}<small>Credit: {{ credit }}</small>{% endif %}
  </figcaption>
  {% endif %}
</figure>
